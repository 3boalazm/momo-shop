# nginx site for OLTRE Collective.
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/oltre
#   sudo sed -i "s/DOMAIN_PLACEHOLDER/yourdomain.com/g" /etc/nginx/sites-available/oltre
#   sudo ln -sf /etc/nginx/sites-available/oltre /etc/nginx/sites-enabled/oltre
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
#
# certbot rewrites the TLS block below in place; leave it as plain :80 first so
# the ACME challenge can complete, then let certbot add :443.

upstream oltre_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Paymob's webhook must never be rate-limited into failure, so it gets its own
# generous zone; everything else shares a tighter one.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER www.DOMAIN_PLACEHOLDER;

    # Uploads and JSON payloads. Keep in step with express.json({limit}).
    client_max_body_size 2m;

    # Don't advertise the exact nginx build.
    server_tokens off;

    access_log /var/log/nginx/oltre.access.log;
    error_log  /var/log/nginx/oltre.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Login/registration: throttle credential stuffing at the edge. ---
    location = /api/auth {
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://oltre_app;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://oltre_app;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Admin analytics queries can be slow; the app caps statements at 20s.
        proxy_read_timeout 30s;
    }

    # Hashed filenames — safe to cache forever. Served by nginx, not Node.
    location /assets/ {
        root /srv/oltre/current/dist/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://oltre_app;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
