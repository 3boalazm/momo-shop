<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="description" content="Élan Collective - Premium Urban Streetwear for Men. Gritty, confident, direct. Raw streetwear for the modern man." />
    <meta name="theme-color" content="#000000" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Élan Collective - Urban Streetwear" />
    <meta property="og:description" content="Built for culture. Driven by individuality. United by style." />
    <meta property="og:image" content="https://momo-collective3.vercel.app/images/hero-banner.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:url" content="https://momo-collective3.vercel.app/" />
    <meta property="og:site_name" content="Élan Collective" />
    <link rel="canonical" href="https://momo-collective3.vercel.app/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Élan Collective",
        "description": "Premium urban streetwear for the modern man.",
        "url": "https://momo-collective3.vercel.app/",
        "currenciesAccepted": "EGP",
        "paymentAccepted": "Cash on Delivery, Card",
        "areaServed": "EG"
      }
    </script>
    <title>Élan Collective - Urban Streetwear</title>
    <script>
      // Apply theme before first paint to avoid flash
      (function () {
        try {
          var t = localStorage.getItem("theme") || "dark";
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
